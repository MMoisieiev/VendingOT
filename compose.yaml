services:
  db:
    image: postgres:17-alpine
    container_name: vendingot-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vendingot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vendingot}
      POSTGRES_DB: ${POSTGRES_DB:-vendingot}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
    name: vendingot-pgdata
